general.import = [
   "./cyberdream.toml",
]

[window]

opacity = 0.97
padding = {x=10,y=10}
decorations = "Full"
decorations_theme_variant = "Dark" # "Dark"
dynamic_title = false
title = "Terminal"

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[cursor]
style.shape = "Block"
style.blinking = "On"
thickness = 0

[font]

normal.family = "GeistMono Nerd Font Mono"
offset = {x = 0, y = 0 }
size = 14.0

[terminal]
shell = {program = "nu", args = ["-e","\"cd ~\"","-l"]}
osc52 = "CopyPaste"

[keyboard]

bindings = [
  {key = "F11", action = "ToggleFullscreen"}
]

[mouse]
bindings = [
  { mouse = "Right", mods = "Control", action = "Paste" },
]


